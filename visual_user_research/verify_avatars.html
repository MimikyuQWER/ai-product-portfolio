<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>头像匹配验证</title>
<style>
  body { font-family: "Segoe UI", "PingFang SC", sans-serif; background: #f0f3f8; padding: 20px; }
  h1 { margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; max-width: 1400px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .card img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #e0e5ec; }
  .card .num { font-size: 12px; color: #888; margin-top: 4px; }
  .card .name { font-size: 16px; font-weight: 700; margin: 6px 0 2px; }
  .card .meta { font-size: 12px; color: #666; }
  .card .tags { font-size: 11px; color: #4164d8; margin-top: 4px; }
  .mismatch { border: 3px solid #e74c3c !important; }
  .controls { margin: 16px 0; }
  button { padding: 8px 16px; margin-right: 8px; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; background: #fff; }
  button:hover { background: #f0f3f8; }
</style>
</head>
<body>
<h1>头像匹配验证 — 28 张图 vs 28 位用户</h1>
<p>当前映射：文件 (N) → 用户 #ID。如果某张图的性别/种族/年龄明显不对，点击图片标记为不匹配。</p>
<div class="controls">
  <button onclick="showAll()">全部显示</button>
  <button onclick="showMismatches()">只看疑似不匹配</button>
  <span id="status" style="margin-left:16px;color:#888;"></span>
</div>
<div class="grid" id="grid"></div>

<script>
// Current mapping: file number → user data (order from prompt file)
const mapping = [
  {file:1, uid:"13", name:"Emily Richardson", meta:"30F / 美国 / 平面设计师", tags:"社交·外向·金发白人女性"},

  {file:8, uid:"55", name:"James Walker", meta:"31M / 英国 / 数据分析师", tags:"精确·硬核·棕发白人男性"},
  {file:9, uid:"16", name:"Hannah Schmidt", meta:"28F / 德国 / UX设计师", tags:"设计敏感·金发白人女性"},
  {file:10, uid:"02", name:"Yuki Tanaka", meta:"24F / 日本 / 插画师", tags:"美术驱动·日本女性"},
  {file:11, uid:"04", name:"Carlos Mendes", meta:"38M / 巴西 / 教师", tags:"怀旧·务实·拉丁裔男性"},
  {file:12, uid:"05", name:"Priya Sharma", meta:"26F / 印度 / 产品经理", tags:"结构化·印度女性"},
  {file:13, uid:"09", name:"Oliver Fischer", meta:"41M / 德国 / IT顾问", tags:"学术·分析型·灰发白人男性"},
  {file:14, uid:"10", name:"Aiko Nakamura", meta:"19F / 日本 / 文学学生", tags:"感性·日本年轻女性"},
  {file:15, uid:"11", name:"David Thompson", meta:"45M / 加拿大 / 高管", tags:"成熟·稳重·灰发白人男性"},

  {file:17, uid:"14", name:"Björn Larsson", meta:"34M / 瑞典 / 游戏程序员", tags:"技术·分析型·金发白人男性"},
  {file:18, uid:"15", name:"Chen Wei", meta:"32M / 新加坡 / 金融分析师", tags:"精确·效率·华裔男性"},
  {file:19, uid:"17", name:"Isabella Rossi", meta:"37F / 意大利 / 时尚买手", tags:"品味·挑剔·深发白人女性"},

  {file:22, uid:"22", name:"Sergei Volkov", meta:"28M / 俄罗斯 / 翻译", tags:"精确·语言洁癖·白人男性"},
  {file:23, uid:"23", name:"Mei Lin", meta:"27F / 马来西亚 / 电商运营", tags:"外向·热情·华裔女性"},
  {file:24, uid:"24", name:"Thomas Mueller", meta:"40M / 瑞士 / CS教授", tags:"理性·收藏家·灰发白人男性"},
  {file:25, uid:"25", name:"Chloe Dubois", meta:"21F / 法国 / 艺术史学生", tags:"浪漫·美学·金发白人女性"},
  {file:26, uid:"26", name:"Ravi Patel", meta:"33M / 英国 / 医生", tags:"内敛·平静·印度裔男性"},
  {file:27, uid:"27", name:"Elena Vasquez", meta:"26F / 墨西哥 / 社区经理", tags:"社媒·热情·拉丁裔女性"},
  {file:28, uid:"28", name:"Ananya Gupta", meta:"24F / 印度 / 配音演员", tags:"表现力·声音敏感·印度女性"},

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = mapping.map(m => `
    <div class="card" id="card-${m.file}" data-match="true">
      <img src="photos/头像生成提示词文件解析 (${m.file}).png"
           onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect fill=%22%23eee%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2216%22>NOT FOUND</text></svg>'"
           onclick="toggleMatch(${m.file})"
           title="点击切换匹配状态">
      <div class="num">文件 (${m.file}).png</div>
      <div class="name">→ #${m.uid} ${m.name}</div>
      <div class="meta">${m.meta}</div>
      <div class="tags">${m.tags}</div>
    </div>
  `).join("");
  document.getElementById("status").textContent = "点击图片标记不匹配，然后告诉我哪些文件号需要互换";
}

function toggleMatch(fileNum) {
  const card = document.getElementById("card-" + fileNum);
  const img = card.querySelector("img");
  const isMatch = card.dataset.match === "true";
  card.dataset.match = isMatch ? "false" : "true";
  img.classList.toggle("mismatch", isMatch);
  updateStatus();
}

function showAll() {
  document.querySelectorAll(".card").forEach(c => c.style.display = "");
}

function showMismatches() {
  document.querySelectorAll(".card").forEach(c => {
    c.style.display = c.dataset.match === "false" ? "" : "none";
  });
}

function updateStatus() {
  const bad = document.querySelectorAll(".mismatch").length;
  document.getElementById("status").textContent = bad > 0
    ? `⚠️ ${bad} 张标记为不匹配 — 告诉我正确的对应关系`
    : "✅ 全部匹配";
}

render();
</script>
</body>
</html>
