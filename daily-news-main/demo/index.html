<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI 资讯日报校招作品 Demo：固定数据快照、Markdown 阅读编辑和可选 AI 润色。" />
    <title>AI 资讯日报 Demo</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === "file:") {
        document.getElementById("root").innerHTML = `
          <main style="max-width:720px;margin:12vh auto;padding:0 24px;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:#171717;line-height:1.75">
            <p style="font-size:13px;color:#666;margin:0 0 12px">AI 资讯日报 · 本地启动提示</p>
            <h1 style="font-size:34px;line-height:1.25;margin:0 0 18px">页面文件完整，但不能通过双击直接运行</h1>
            <p>这个 Demo 使用 React、TypeScript 和本地 Markdown 数据，需要由随项目提供的轻量服务加载。直接打开 <code>index.html</code> 时，浏览器无法编译 TSX，也会限制本地数据请求。</p>
            <ol style="padding-left:22px">
              <li>在本目录打开 PowerShell 或终端</li>
              <li>首次运行：<code>npm install</code></li>
              <li>启动：<code>npm run demo</code></li>
              <li>浏览器访问：<a href="http://127.0.0.1:4173">http://127.0.0.1:4173</a></li>
            </ol>
            <p style="margin-top:22px;color:#666">不配置 API Key 也可以体验日报阅读、日期切换、编辑、草稿、撤销和本地导出；只有 AI 润色为可选能力。</p>
            <p><a href="README.md" style="color:#171717;font-weight:600">查看完整启动与产品说明 →</a></p>
          </main>`;
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
